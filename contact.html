<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | StockPilot</title>
  <meta name="description" content="Questions or feedback about StockPilot? Send us a message and we will get back to you.">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo"><img src="images/logo.svg" alt="" width="32" height="32">Stock<span>Pilot</span></a>
    <div class="header-right">
      <nav id="menu" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="inventory.html">Inventory</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <button id="theme-btn" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
      <button id="menu-btn" class="icon-btn" aria-label="Toggle menu" aria-expanded="false" aria-controls="menu">Menu</button>
    </div>
  </header>

  <main>
    <div class="page-banner">
      <div class="container">
        <h1>Contact us</h1>
        <p>Questions, feedback or feature ideas? We would love to hear from you.</p>
      </div>
    </div>

    <section class="section">
      <div class="container contact-grid">
        <div class="card">
          <form id="contact-form" novalidate>
            <div class="form-group">
              <label for="name">Your name</label>
              <input id="name" name="name" type="text" autocomplete="name" required>
              <div class="error" id="err-name"></div>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
              <div class="error" id="err-email"></div>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required></textarea>
              <div class="error" id="err-message"></div>
            </div>
            <button type="submit" class="btn">Send message</button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>

        <div class="card">
          <h3>Get in touch</h3>
          <p style="margin:10px 0">📧 hello@stockpilot.example</p>
          <p style="margin:10px 0">📍 Lahore, Pakistan</p>
          <p style="margin:10px 0">🕘 Mon to Fri, 9am to 6pm</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year">2026</span> StockPilot. All rights reserved.</p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
